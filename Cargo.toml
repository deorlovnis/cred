[package]
name = "cred"
version = "0.5.1"
edition = "2024"
description = "macOS Keychain-backed secrets for humans and agents"

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
base64 = "0.22"
block2 = "0.6"
clap = { version = "4.6", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
percent-encoding = "2.3"
rpassword = "7.5"
rusqlite = { version = "0.41", features = ["bundled"] }
security-framework = "3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
snap = "1"
toml = "1.1"
ureq = "3.5"
url = "2.5"

[profile.release]
lto = true
strip = true
