[tools]
rust = "stable"

[tasks.check]
description = "Format, lints and all tests that need no human: run before pushing"
run = "cargo fmt --check && (cd box/shim && cargo fmt --check) && cargo clippy --all-targets -- -D warnings && cargo check --release && node --check runner/runner.mjs && cargo test"

[tasks.e2e]
description = "End-to-end tests of the built binary (no Touch ID, fake Keychain)"
run = "cargo test --test e2e"

[tasks.e2e-opt-in]
description = "Also the browser (needs npm ci in runner/) and a real Touch ID approval (a human taps)"
run = "cd runner && npm ci --ignore-scripts --no-audit --no-fund --silent && cd .. && CRED_E2E_BROWSER=1 CRED_E2E_INTERACTIVE=1 cargo test --test e2e -- --ignored --test-threads=1"

[tasks.e2e-box]
description = "Engine and door end to end: builds the agent and browser images and runs VMs, with Chromium through the door (needs Apple container and the internet)"
env = { CRED_E2E_BOX = "1" }
run = "cargo test --test box_engine -- --ignored --nocapture && cargo test --bin cred real_vm -- --ignored --nocapture"
