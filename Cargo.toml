[package]
name = "cred"
version = "0.2.0"
edition = "2024"
description = "macOS Keychain-backed secrets for humans and agents"

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
rpassword = "7.5"
rusqlite = { version = "0.41", features = ["bundled"] }
security-framework = "3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snap = "1"

[profile.release]
lto = true
strip = true
